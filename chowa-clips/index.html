<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0b0a">
<title>Chowa Clips</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0e0b0a;--s1:#1b1614;--line:rgba(255,240,230,.08);--txt:#fbf3ee;--mut:#ab9c93;--grad:linear-gradient(135deg,#ffb347,#ff7a45 55%,#ff5f6d)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 80% -10%,rgba(255,122,69,.18),transparent 60%),radial-gradient(700px 400px at 0% 110%,rgba(255,95,109,.12),transparent 60%),var(--bg)}
.card{width:min(380px,100%);text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--s1);border:1px solid var(--line);border-radius:26px;padding:32px 24px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:var(--grad);display:grid;place-items:center;font-size:32px;box-shadow:0 10px 26px rgba(255,122,69,.4)}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.03em}
p{color:var(--mut);margin:0;font-size:15px;line-height:1.45}
.spin{width:34px;height:34px;margin:22px auto 4px;border-radius:50%;border:4px solid rgba(255,240,230,.1);border-top-color:#ff8a4c;animation:s .9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.btns{display:none;flex-direction:column;gap:10px;margin-top:22px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;text-decoration:none}
.go{color:#2a0f00;background:var(--grad);box-shadow:0 10px 24px rgba(255,122,69,.35)}
.ghost{color:var(--txt);background:transparent;border:1px solid rgba(255,240,230,.14)}
.small{font-size:12px;color:#6f625b;margin-top:14px}
.err .spin{display:none}.err .btns{display:flex}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="logo">🎬</div>
  <h1>Chowa Clips 🤠</h1>
  <p id="msg">loading…</p>
  <div class="spin"></div>
  <div class="btns">
    <button class="btn go" id="retry">Try again</button>
    <a class="btn ghost" id="anyway" href="#" style="display:none">Open last known link anyway</a>
  </div>
  <div class="small" id="small"></div>
</main>
<script>
(function(){
  // The dashboard runs behind a tunnel whose URL changes every couple of hours.
  // The current URL lives in chowa-clips/url.json in this repo (updated automatically by the dashboard box).
  var REPO = "arinouri/arinouri.ca", PATH = "chowa-clips/url.json", BRANCH = "main";
  var OK = /^https:\/\/[a-z0-9-]+\.(runlocal\.eu|trycloudflare\.com)\/?$/;
  var msg = document.getElementById("msg"), small = document.getElementById("small"), card = document.getElementById("card");
  var anyway = document.getElementById("anyway"), timer = null;
  function t(){ return Date.now(); }
  function withTimeout(p, ms){ return new Promise(function(res, rej){ var id = setTimeout(function(){ rej(new Error("timeout")); }, ms); p.then(function(v){ clearTimeout(id); res(v); }, function(e){ clearTimeout(id); rej(e); }); }); }
  function getJSON(u){ return withTimeout(fetch(u, {cache: "no-store"}), 8000).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); }); }
  var sources = [
    // 1) GitHub API: always the latest commit, CORS-enabled (60 req/h per IP unauthenticated)
    function(){ return getJSON("https://api.github.com/repos/" + REPO + "/contents/" + PATH + "?ref=" + BRANCH + "&t=" + t()).then(function(j){
      var b = atob(j.content.replace(/\s/g, "")); try { b = decodeURIComponent(escape(b)); } catch(e) {} return JSON.parse(b); }); },
    // 2) raw.githubusercontent (may lag ~5 min)
    function(){ return getJSON("https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/" + PATH + "?t=" + t()); },
    // 3) this site's own copy (lags until Pages redeploys)
    function(){ return getJSON("/" + PATH + "?t=" + t()); }
  ];
  function findUrl(i){
    i = i || 0;
    if (i >= sources.length) return Promise.reject(new Error("no source"));
    return sources[i]().then(function(j){ if(!j || !OK.test(j.url || "")) throw new Error("bad url"); return j; })
      .catch(function(){ return findUrl(i + 1); });
  }
  function alive(url){ // the dashboard answers /healthz with CORS enabled
    return withTimeout(fetch(url.replace(/\/$/, "") + "/healthz?t=" + t(), {cache: "no-store", mode: "cors"}), 7000)
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return true; });
  }
  function fail(text, url){
    card.className = "card err"; msg.textContent = text;
    if (url) { anyway.href = url; anyway.style.display = "block"; }
    var n = 20; small.textContent = "Retrying automatically in " + n + "s…";
    clearInterval(timer); timer = setInterval(function(){ n--; small.textContent = "Retrying automatically in " + n + "s…"; if (n <= 0) { clearInterval(timer); run(); } }, 1000);
  }
  function run(){
    clearInterval(timer); card.className = "card"; msg.textContent = "loading…"; small.textContent = ""; anyway.style.display = "none";
    findUrl().then(function(j){
      msg.textContent = "found the dashboard, connecting…";
      return alive(j.url).then(function(){
        msg.textContent = "opening…"; window.location.replace(j.url.replace(/\/$/, "") + "/");
      }, function(){
        fail("The dashboard link is being refreshed (it changes every couple of hours). Give it a minute.", j.url);
      });
    }, function(){
      fail("Couldn't look up the dashboard link right now. Check your connection and try again.");
    });
  }
  document.getElementById("retry").onclick = run;
  run();
})();
</script>
</body>
</html>
